<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Matching - Aesthetic Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* 🎨 BACKGROUND ESTETIK DINAMIS */
        body {
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            user-select: none;
        }

        /* 🏆 HEADER LOGO BRANDING */
        .brand-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .brand-logo {
            width: 60px;
            height: 60px;
            object-fit: contain;
            filter: drop-shadow(0 4px 8px rgba(0,210,211,0.4));
        }

        .brand-title h1 {
            font-size: 22px;
            color: #00d2d3;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* 👤 DUAL CHARACTER & PANEL STATISTIK */
        .game-panel {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 520px;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(10px);
            padding: 12px 20px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            margin-bottom: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
        }

        .char-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .char-avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: #222f3e;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            border: 2px solid #00d2d3;
            overflow: hidden;
        }

        .char-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .char-name {
            font-size: 11px;
            font-weight: bold;
            color: #c8d6e5;
        }

        .stats-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .stat-badge {
            background: rgba(0, 0, 0, 0.4);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* 🎮 INDIKATOR MODE KONTROL */
        .gamepad-status {
            font-size: 11px;
            padding: 4px 12px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: #c8d6e5;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .gamepad-status.active {
            background: #2ed573;
            color: white;
        }

        /* 🔲 ARENA BOARD GAME */
        .board {
            display: grid;
            gap: 10px;
            justify-content: center;
        }

        .board.level-1 { grid-template-columns: repeat(4, 80px); }
        .board.level-2 { grid-template-columns: repeat(4, 80px); }
        .board.level-3 { grid-template-columns: repeat(6, 75px); }

        .card {
            width: 100%;
            height: 80px;
            background-color: #222f3e;
            border-radius: 10px;
            cursor: pointer;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            transition: transform 0.2s, border 0.2s;
            position: relative;
        }

        .card:hover { 
            transform: scale(1.05);
            border: 2px solid #00d2d3;
        }

        .card img, .card .enemy-icon {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
            pointer-events: none;
        }

        .card .enemy-icon {
            font-size: 38px;
            background: #ff4757;
            display: none;
            align-items: center;
            justify-content: center;
        }

        /* Status Kartu */
        .card.flipped { border: 2px solid #00d2d3; }
        .card.flipped img, .card.flipped .enemy-icon { display: flex; }

        .card.matched {
            border: 2px solid #2ed573;
            opacity: 0.7;
            cursor: default;
        }
        .card.matched img { display: block; }

        .card.joy-selected {
            border: 3px solid #ff9f43 !important;
            transform: scale(1.08);
            box-shadow: 0 0 15px #ff9f43;
        }

        /* 🎵 CONTROLS */
        .control-btns {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn {
            padding: 8px 16px;
            background: #10ac84;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }
        .btn:hover { background: #1dd1a1; }
    </style>
</head>
<body>

    <!-- 🏆 HEADER LOGO BRANDING -->
    <div class="brand-header">
        <!-- Logo default dari CDN internet -->
        <img src="https://cdn-icons-png.flaticon.com/512/808/808439.png" alt="Logo" class="brand-logo">
        <div class="brand-title">
            <h1>Game Development</h1>
            <p style="font-size: 11px; color: #8395a7;">Aesthetic Matching Project</p>
        </div>
    </div>

    <!-- 🎮 STATUS KONTROL -->
    <div id="gamepadStatus" class="gamepad-status">🖱️ Mode: Mouse / Touch Screen</div>

    <!-- 👤 DUAL CHARACTER & STATS -->
    <div class="game-panel">
        <div class="char-box">
            <div class="char-avatar">
                <!-- Avatar Player dari CDN -->
                <img src="https://cdn-icons-png.flaticon.com/512/4140/4140048.png" alt="Player">
            </div>
            <span class="char-name">PLAYER</span>
        </div>

        <div class="stats-center">
            <div id="levelText" style="font-size: 12px; color: #00d2d3; font-weight: bold;">LEVEL 1</div>
            <div class="stat-badge">⏱️ Waktu: <span id="timer">40</span>s</div>
            <div class="stat-badge">🏆 Skor: <span id="score">0</span></div>
        </div>

        <div class="char-box">
            <div class="char-avatar" style="border-color: #ff4757;">
                <!-- Avatar Musuh dari CDN -->
                <img src="https://cdn-icons-png.flaticon.com/512/1236/1236280.png" alt="Enemy">
            </div>
            <span class="char-name" style="color: #ff4757;">MUSUH</span>
        </div>
    </div>

    <!-- 🔲 BOARD GAME -->
    <div class="board level-1" id="board"></div>

    <div class="control-btns">
        <button class="btn" onclick="toggleAudio()">🎵 Suara On/Off</button>
    </div>

    <script>
        // 1. DATA GAMBAR KARTU DARI ONLINE (Unsplash CDN)
        const allImages = [
            'https://images.unsplash.com/photo-1579783902614-a3fb3927b675?w=150',
            'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=150',
            'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=150',
            'https://images.unsplash.com/photo-1563089145-599997674d42?w=150',
            'https://images.unsplash.com/photo-1550684848-fac1c5b4e853?w=150',
            'https://images.unsplash.com/photo-1541701494587-cb58502866ab?w=150',
            'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=150',
            'https://images.unsplash.com/photo-1519681393784-d120267933ba?w=150',
            'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=150',
            'https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=150'
        ];

        let currentLevel = 1;
        let score = 0;
        let timeLeft = 40;
        let timerInterval = null;
        let flippedCards = [];
        let matchedCount = 0;
        let canClick = true;
        let currentDeck = [];
        let joyIndex = -1;

        const timerEl = document.getElementById('timer');
        const scoreEl = document.getElementById('score');
        const board = document.getElementById('board');
        const levelText = document.getElementById('levelText');
        const gamepadStatus = document.getElementById('gamepadStatus');

        const levelConfig = {
            1: { pairs: 3, hasEnemy: false, time: 40, gridClass: 'level-1', name: 'LEVEL 1: MUDAH', cols: 4 },
            2: { pairs: 5, hasEnemy: true,  time: 45, gridClass: 'level-2', name: 'LEVEL 2: AWAS MUSUH! 👾', cols: 4 },
            3: { pairs: 10, hasEnemy: true, time: 60, gridClass: 'level-3', name: 'LEVEL 3: MASTER 🏆', cols: 6 }
        };

        // 2. MUSIK & SFX
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let isAudioMuted = false;

        function playSound(freq, type = 'sine', duration = 0.15) {
            if (isAudioMuted) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
            osc.stop(audioCtx.currentTime + duration);
        }

        function toggleAudio() {
            isAudioMuted = !isAudioMuted;
            alert(isAudioMuted ? "Suara Dimatikan 🔇" : "Suara Diaktifkan 🔊");
        }

        // 3. JALANKAN LEVEL
        function startLevel(level) {
            clearInterval(timerInterval);
            board.innerHTML = '';
            flippedCards = [];
            matchedCount = 0;
            canClick = true;
            joyIndex = -1;

            const config = levelConfig[level];
            timeLeft = config.time;
            timerEl.innerText = timeLeft;
            levelText.innerText = config.name;
            board.className = `board ${config.gridClass}`;

            let selectedImages = allImages.slice(0, config.pairs);
            currentDeck = [];

            selectedImages.forEach(img => {
                currentDeck.push({ type: 'img', val: img });
                currentDeck.push({ type: 'img', val: img });
            });

            if (config.hasEnemy) {
                currentDeck.push({ type: 'enemy', val: 'ENEMY' });
                currentDeck.push({ type: 'enemy', val: 'ENEMY' });
            }

            currentDeck.sort(() => Math.random() - 0.5);

            currentDeck.forEach((item, index) => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.type = item.type;
                card.dataset.value = item.val;
                card.dataset.index = index;

                if (item.type === 'img') {
                    const img = document.createElement('img');
                    img.src = item.val;
                    card.appendChild(img);
                } else {
                    const enemy = document.createElement('div');
                    enemy.classList.add('enemy-icon');
                    enemy.innerText = '👾';
                    card.appendChild(enemy);
                }

                card.onclick = function() {
                    joyIndex = -1; 
                    updateJoystickHighlight();
                    triggerCardFlip(this);
                };

                board.appendChild(card);
            });

            timerInterval = setInterval(() => {
                timeLeft--;
                timerEl.innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    playSound(150, 'sawtooth', 0.5);
                    alert('⏳ Waktu Habis! Coba lagi!');
                    startLevel(currentLevel);
                }
            }, 1000);
        }

        // 4. BUKA KARTU
        function triggerCardFlip(card) {
            if (!canClick || 
                card.classList.contains('flipped') || 
                card.classList.contains('matched')) {
                return;
            }

            playSound(400, 'sine', 0.1);
            card.classList.add('flipped');

            if (card.dataset.type === 'enemy') {
                playSound(120, 'sawtooth', 0.4);
                score = Math.max(0, score - 25);
                scoreEl.innerText = score;
                canClick = false;

                setTimeout(() => {
                    alert('👾 JEBAKAN MUSUH! Skor berkurang -25!');
                    card.classList.remove('flipped');
                    canClick = true;
                }, 500);
                return;
            }

            flippedCards.push(card);

            if (flippedCards.length === 2) {
                checkMatch();
            }
        }

        function checkMatch() {
            const [card1, card2] = flippedCards;

            if (card1.dataset.value === card2.dataset.value) {
                playSound(600, 'sine', 0.2);
                card1.classList.add('matched');
                card2.classList.add('matched');
                
                score += 20;
                scoreEl.innerText = score;
                
                flippedCards = [];
                matchedCount += 2;

                const totalImageCards = currentDeck.filter(item => item.type === 'img').length;

                if (matchedCount === totalImageCards) {
                    clearInterval(timerInterval);
                    playSound(800, 'triangle', 0.4);

                    setTimeout(() => {
                        if (currentLevel < 3) {
                            alert(`🎉 Level ${currentLevel} Selesai!\nSkor Saat Ini: ${score}`);
                            currentLevel++;
                            startLevel(currentLevel);
                        } else {
                            alert(`🏆 SELAMAT! Kamu Menamatkan Seluruh Level!\nSkor Akhir: ${score}`);
                        }
                    }, 400);
                }
            } else {
                playSound(200, 'square', 0.2);
                canClick = false;

                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    flippedCards = [];
                    canClick = true;
                }, 800);
            }
        }

        // 5. NAVIGASI JOYSTICK
        let lastAxisMove = 0;

        function updateJoystickHighlight() {
            const cards = document.querySelectorAll('.card');
            cards.forEach((c, idx) => {
                if (idx === joyIndex) {
                    c.classList.add('joy-selected');
                } else {
                    c.classList.remove('joy-selected');
                }
            });
        }

        function pollGamepad() {
            const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
            let gp = gamepads[0];

            if (gp) {
                gamepadStatus.innerText = `🕹️ Joystick Terhubung: ${gp.id.substring(0, 20)}...`;
                gamepadStatus.classList.add('active');

                const cols = levelConfig[currentLevel].cols;
                const totalCards = currentDeck.length;
                const now = Date.now();

                if (now - lastAxisMove > 200) {
                    let axisX = gp.axes[0] || (gp.buttons[14]?.pressed ? -1 : gp.buttons[15]?.pressed ? 1 : 0);
                    let axisY = gp.axes[1] || (gp.buttons[12]?.pressed ? -1 : gp.buttons[13]?.pressed ? 1 : 0);

                    if (axisX < -0.5 || axisX > 0.5 || axisY < -0.5 || axisY > 0.5) {
                        if (joyIndex === -1) joyIndex = 0;
                        
                        if (axisX < -0.5 && joyIndex % cols !== 0) joyIndex--;
                        else if (axisX > 0.5 && (joyIndex + 1) % cols !== 0 && joyIndex + 1 < totalCards) joyIndex++;
                        else if (axisY < -0.5 && joyIndex - cols >= 0) joyIndex -= cols;
                        else if (axisY > 0.5 && joyIndex + cols < totalCards) joyIndex += cols;

                        lastAxisMove = now;
                        updateJoystickHighlight();
                    }
                }

                if (gp.buttons[0].pressed && joyIndex !== -1) {
                    const cards = document.querySelectorAll('.card');
                    if (cards[joyIndex] && canClick) {
                        triggerCardFlip(cards[joyIndex]);
                        canClick = false; 
                        setTimeout(() => canClick = true, 300);
                    }
                }
            } else {
                gamepadStatus.innerText = "🖱️ Mode: Mouse / Touch Screen Active";
                gamepadStatus.classList.remove('active');
            }

            requestAnimationFrame(pollGamepad);
        }

        startLevel(currentLevel);
        requestAnimationFrame(pollGamepad);
    </script>
</body>
</html>
