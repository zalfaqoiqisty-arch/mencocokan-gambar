<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 📌 JUDUL UNTUK BROWSER & PREVIEW LINK -->
    <title>MATCH PICTURE - GAME MENCOCOKKAN GAMBAR</title>
    <meta property="og:title" content="MATCH PICTURE - GAME MENCOCOKKAN GAMBAR">
    <meta property="og:description" content="Aesthetic Matching Project">
    <meta property="og:type" content="website">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px 20px 80px 20px; /* Padding bawah ditambah agar tidak tertutup panel audio */
            user-select: none;
            overflow-x: hidden;
        }

        /* 📌 HEADER LOGO BERDERET (LOGOGAME & TEKS DI TENGAH) */
        .brand-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.05);
            padding: 12px 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            margin-bottom: 20px;
            width: 100%;
            max-width: 900px;
        }

        .header-logos-left, .header-logos-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-logos-left img, .header-logos-right img {
            width: 45px;
            height: 45px;
            object-fit: contain;
            border-radius: 8px;
        }

        /* LOGO GAME + TULISAN DI TENGAH HEADER */
        .center-logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0 10px;
        }

        .center-logo img {
            height: 50px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
            margin-bottom: 4px;
        }

        .brand-title h1 {
            font-size: 13px;
            color: #00d2d3;
            text-transform: uppercase;
            letter-spacing: 1px;
            line-height: 1.2;
        }

        .brand-title p {
            font-size: 10px;
            color: #8395a7;
            margin-top: 2px;
        }

        /* 🏠 HALAMAN UTAMA */
        #home-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.03);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: 10px;
        }

        .home-main-logo {
            width: 180px;
            height: auto;
            margin-bottom: 15px;
            filter: drop-shadow(0 8px 15px rgba(0,0,0,0.5));
        }

        .main-play-btn {
            padding: 14px 35px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            color: #fff;
            background: linear-gradient(135deg, #10ac84 0%, #1dd1a1 100%);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(16, 172, 132, 0.4);
            margin-top: 15px;
            transition: transform 0.2s;
        }

        .main-play-btn:hover {
            transform: scale(1.05);
        }

        /* 🎮 ARENA GAME */
        #game-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 600px;
        }

        .game-panel {
            display: flex;
            align-items: center;
            justify-content: space-around;
            width: 100%;
            background: rgba(255, 255, 255, 0.07);
            padding: 15px 25px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            margin-bottom: 20px;
        }

        .stats-center {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .stat-badge {
            background: rgba(0, 0, 0, 0.4);
            padding: 6px 16px;
            border-radius: 15px;
            font-size: 14px;
            font-weight: bold;
        }

        /* 🔲 PAPAN KARTU (LAYOUT TINGKAT LEVEL) */
        .board {
            display: grid;
            gap: 10px;
            justify-content: center;
            margin-bottom: 15px;
            width: 100%;
        }

        .board.level-1 { grid-template-columns: repeat(3, 85px); }
        .board.level-2 { grid-template-columns: repeat(4, 75px); }
        .board.level-3 { grid-template-columns: repeat(4, 70px); }
        .board.level-4 { grid-template-columns: repeat(4, 65px); }
        .board.level-5 { grid-template-columns: repeat(5, 60px); }

        .card {
            height: 80px;
            background: #222f3e;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            border: 2px solid rgba(255,255,255,0.1);
            position: relative;
            transition: transform 0.2s;
        }

        .board.level-5 .card {
            height: 70px;
        }

        .card:hover {
            transform: scale(1.05);
        }

        .card::before {
            content: "❓";
            font-size: 22px;
            opacity: 0.6;
        }

        .card img {
            width: 75%;
            height: 75%;
            object-fit: contain;
            display: none;
        }

        .card.flipped::before, .card.matched::before {
            display: none;
        }

        .card.flipped, .card.matched {
            background: #ffffff;
            border-color: #00d2d3;
        }

        .card.flipped img, .card.matched img {
            display: block;
        }

        .card.matched {
            border-color: #2ed573;
            opacity: 0.6;
            cursor: default;
        }

        /* 🎛️ PANEL PENGATURAN AUDIO (BOGOH / STICKY FOOTER) */
        .audio-settings-bar {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 600px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            padding: 8px 20px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            z-index: 1000;
            gap: 15px;
        }

        .audio-control-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: bold;
            color: #00d2d3;
        }

        .audio-control-group label {
            white-space: nowrap;
        }

        .audio-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 80px;
            height: 5px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            outline: none;
            cursor: pointer;
        }

        .audio-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #1dd1a1;
            cursor: pointer;
            box-shadow: 0 0 5px rgba(29, 209, 161, 0.8);
        }

        .mute-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .mute-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <!-- BRANDING HEADER: LOGO KIRI | LOGO & TULISAN TENGAH | LOGO KANAN -->
    <div class="brand-header">
        <div class="header-logos-left">
            <img src="logoSmk.jpeg" alt="Logo SMK">
            <img src="hkihhcgfk.jpeg" alt="Logo UZ" onerror="this.onerror=null; this.src='hkihhcgfk.png';">
        </div>
        
        <div class="center-logo">
            <img src="logogame.png" alt="Match Picture Logo">
            <div class="brand-title">
                <h1>GAME MENCOCOKKAN GAMBAR</h1>
                <p>Aesthetic Matching</p>
            </div>
        </div>

        <div class="header-logos-right">
            <img src="ppm.jpeg" alt="Logo MOKO" onerror="this.onerror=null; this.src='ppm.png';">
            <img src="logojurusan.jpeg" alt="Logo Jurusan">
            <img src="logo67.jpeg" alt="Logo Onesandvoscho" onerror="this.onerror=null; this.src='logo67.png';">
        </div>
    </div>

    <!-- BERANDA -->
    <div id="home-screen">
        <img src="logogame.png" alt="Match Picture Logo" class="home-main-logo">
        <p style="color: #c8d6e5; font-size: 14px; margin-bottom: 10px;">Temukan pasangan gambar yang cocok sebelum waktu habis!</p>
        <button class="main-play-btn" onclick="mulaiPermainan()">Mulai Permainan</button>
    </div>

    <!-- ARENA GAME -->
    <div id="game-screen">
        <div class="game-panel">
            <div id="levelText" style="color:#00d2d3; font-weight:bold; font-size:15px;">LEVEL 1</div>
            <div class="stats-center">
                <div class="stat-badge">⏱️ Waktu: <span id="timer">70</span>s</div>
                <div class="stat-badge">🏆 Skor: <span id="score">0</span></div>
            </div>
        </div>

        <div class="board level-1" id="board"></div>
    </div>

    <!-- 🎛️ PANEL PENGATURAN EFEK SUARA DI BAGIAN BAWAH -->
    <div class="audio-settings-bar">
        <div class="audio-control-group">
            <label for="sfxVolume">🔔 SFX:</label>
            <input type="range" id="sfxVolume" class="audio-slider" min="0" max="1" step="0.05" value="1" oninput="updateAudioSettings()">
            <span id="sfxVal" style="color:#fff;">100%</span>
        </div>

        <div class="audio-control-group">
            <label for="bgmVolume">🎵 BGM:</label>
            <input type="range" id="bgmVolume" class="audio-slider" min="0" max="0.1" step="0.005" value="0.02" oninput="updateAudioSettings()">
            <span id="bgmVal" style="color:#fff;">20%</span>
        </div>

        <button class="mute-btn" id="muteBtn" onclick="toggleMute()">🔊 Suara On</button>
    </div>

    <script>
        // 🔊 SYSTEM SOUND EFFECT & BGM (Web Audio API)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let isBgmPlaying = false;
        let bgmInterval = null;

        // VARIABLE VOLUME CONTROL
        let sfxVolumeGain = 1.0;
        let bgmVolumeGain = 0.02;
        let isMuted = false;

        function updateAudioSettings() {
            const sfxInput = parseFloat(document.getElementById('sfxVolume').value);
            const bgmInput = parseFloat(document.getElementById('bgmVolume').value);

            sfxVolumeGain = sfxInput;
            bgmVolumeGain = bgmInput;

            document.getElementById('sfxVal').innerText = Math.round(sfxInput * 100) + '%';
            document.getElementById('bgmVal').innerText = Math.round((bgmInput / 0.1) * 100) + '%';
        }

        function toggleMute() {
            isMuted = !isMuted;
            const btn = document.getElementById('muteBtn');
            if (isMuted) {
                btn.innerText = '🔇 Mute';
                btn.style.background = 'rgba(238, 82, 83, 0.4)';
            } else {
                btn.innerText = '🔊 Suara On';
                btn.style.background = 'rgba(255, 255, 255, 0.1)';
            }
        }

        // 🎵 MUSIK BACKGROUND (BGM Chiptune Loop)
        function startBGM() {
            if (isBgmPlaying) return;
            isBgmPlaying = true;

            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const notes = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63]; 
            let noteIndex = 0;

            bgmInterval = setInterval(() => {
                if (!isBgmPlaying) return;
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                
                if (isMuted || bgmVolumeGain <= 0) return;

                const osc = audioCtx.createOscillator();
                const noteGain = audioCtx.createGain();
                
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(notes[noteIndex], audioCtx.currentTime);
                
                noteGain.gain.setValueAtTime(bgmVolumeGain, audioCtx.currentTime);
                noteGain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.25);
                
                osc.connect(noteGain);
                noteGain.connect(audioCtx.destination);
                
                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + 0.25);

                noteIndex = (noteIndex + 1) % notes.length;
            }, 300);
        }

        function initAutoAudio() {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            startBGM();
        }

        window.addEventListener('DOMContentLoaded', initAutoAudio);
        window.addEventListener('load', initAutoAudio);
        ['click', 'touchstart', 'keydown', 'mousemove'].forEach(evt => {
            window.addEventListener(evt, () => {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                startBGM();
            }, { once: false });
        });

        // 🔔 EFEK SUARA GAME
        function playSound(type) {
            if (isMuted || sfxVolumeGain <= 0) return;

            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'flip') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(500, now);
                osc.frequency.exponentialRampToValueAtTime(1200, now + 0.08);
                gain.gain.setValueAtTime(0.95 * sfxVolumeGain, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (type === 'match') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.08);
                osc.frequency.setValueAtTime(783.99, now + 0.16);
                osc.frequency.setValueAtTime(1046.50, now + 0.24);
                gain.gain.setValueAtTime(1.0 * sfxVolumeGain, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.setValueAtTime(150, now + 0.12);
                gain.gain.setValueAtTime(0.95 * sfxVolumeGain, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'win') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.12);
                osc.frequency.setValueAtTime(783.99, now + 0.24);
                osc.frequency.setValueAtTime(1046.50, now + 0.36);
                gain.gain.setValueAtTime(1.0 * sfxVolumeGain, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.7);
                osc.start(now);
                osc.stop(now + 0.7);
            } else if (type === 'lose') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.setValueAtTime(300, now + 0.15);
                osc.frequency.setValueAtTime(200, now + 0.3);
                osc.frequency.setValueAtTime(100, now + 0.45);
                gain.gain.setValueAtTime(1.0 * sfxVolumeGain, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.8);
                osc.start(now);
                osc.stop(now + 0.8);
            }
        }

        // Koleksi Ikon Gambar
        const onlineImages = [
            'https://cdn-icons-png.flaticon.com/512/742/742751.png',
            'https://cdn-icons-png.flaticon.com/512/3081/3081840.png',
            'https://cdn-icons-png.flaticon.com/512/616/616408.png',
            'https://cdn-icons-png.flaticon.com/512/414/414004.png',
            'https://cdn-icons-png.flaticon.com/512/2909/2909762.png',
            'https://cdn-icons-png.flaticon.com/512/1046/1046784.png',
            'https://cdn-icons-png.flaticon.com/512/2972/2972531.png',
            'https://cdn-icons-png.flaticon.com/512/869/869869.png',
            'https://cdn-icons-png.flaticon.com/512/1152/1152755.png',
            'https://cdn-icons-png.flaticon.com/512/3135/3135715.png'
        ];

        let currentLevel = 1;
        let score = 0;
        let timeLeft = 70;
        let timerInterval = null;
        let flippedCards = [];
        let matchedCount = 0;
        let canClick = true;

        // Configuration 5 LEVEL
        const levelConfig = {
            1: { pairs: 3, gridClass: 'level-1', name: 'LEVEL 1' },
            2: { pairs: 4, gridClass: 'level-2', name: 'LEVEL 2' },
            3: { pairs: 6, gridClass: 'level-3', name: 'LEVEL 3' },
            4: { pairs: 8, gridClass: 'level-4', name: 'LEVEL 4: EXPERT' },
            5: { pairs: 10, gridClass: 'level-5', name: 'LEVEL 5: ULTIMATE' }
        };

        function mulaiPermainan() {
            playSound('flip');
            startBGM(); 
            document.getElementById('home-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
            currentLevel = 1;
            score = 0;
            document.getElementById('score').innerText = score;
            startLevel(currentLevel);
        }

        function startLevel(level) {
            clearInterval(timerInterval);
            const board = document.getElementById('board');
            board.innerHTML = '';
            flippedCards = [];
            matchedCount = 0;
            canClick = true;

            const config = levelConfig[level];
            timeLeft = 70;
            document.getElementById('timer').innerText = timeLeft;
            document.getElementById('levelText').innerText = config.name;
            board.className = `board ${config.gridClass}`;

            let deck = [];
            let selectedImages = onlineImages.slice(0, config.pairs);

            selectedImages.forEach((imgUrl, idx) => {
                deck.push({ type: 'img', url: imgUrl, id: idx });
                deck.push({ type: 'img', url: imgUrl, id: idx });
            });

            deck.sort(() => Math.random() - 0.5);

            deck.forEach(item => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.id = item.id;

                const img = document.createElement('img');
                img.src = item.url;

                card.appendChild(img);
                card.onclick = () => flipCard(card);
                board.appendChild(card);
            });

            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    playSound('lose');
                    alert('⏳ Waktu Habis! Mengulang level...');
                    startLevel(currentLevel);
                }
            }, 1000);
        }

        function flipCard(card) {
            if (!canClick || card.classList.contains('flipped') || card.classList.contains('matched')) return;

            playSound('flip');
            card.classList.add('flipped');
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                canClick = false;
                const [card1, card2] = flippedCards;

                if (card1.dataset.id === card2.dataset.id) {
                    playSound('match');
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    score += 10;
                    document.getElementById('score').innerText = score;
                    flippedCards = [];
                    matchedCount += 2;
                    canClick = true;

                    const totalImages = levelConfig[currentLevel].pairs * 2;
                    if (matchedCount === totalImages) {
                        clearInterval(timerInterval);
                        playSound('win');
                        setTimeout(() => {
                            if (currentLevel < 5) {
                                alert(`🎉 LEVEL ${currentLevel} SELESAI!\nSkor: ${score}\nLanjut ke Level ${currentLevel + 1}`);
                                currentLevel++;
                                startLevel(currentLevel);
                            } else {
                                alert(`🏆 SELAMAT! ANDA BERHASIL MENYELESAIKAN SEMUA LEVEL (1 - 5)!\nSkor Akhir: ${score}`);
                                location.reload();
                            }
                        }, 300);
                    }
                } else {
                    setTimeout(() => {
                        playSound('wrong');
                        card1.classList.remove('flipped');
                        card2.classList.remove('flipped');
                        flippedCards = [];
                        canClick = true;
                    }, 600);
                }
            }
        }
    </script>
</body>
</html>
