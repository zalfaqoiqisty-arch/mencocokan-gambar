<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Matching - Aesthetic SVG Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            user-select: none;
        }

        .brand-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .brand-logo {
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            background: rgba(0, 210, 211, 0.15);
            border: 2px solid #00d2d3;
            border-radius: 12px;
            box-shadow: 0 0 12px rgba(0,210,211,0.3);
        }

        .brand-title h1 {
            font-size: 20px;
            color: #00d2d3;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .game-panel {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(10px);
            padding: 12px 20px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            margin-bottom: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
        }

        .char-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .char-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #222f3e;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 26px;
            border: 2px solid #00d2d3;
        }

        .char-name {
            font-size: 11px;
            font-weight: bold;
            color: #c8d6e5;
        }

        .stats-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .stat-badge {
            background: rgba(0, 0, 0, 0.4);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .board {
            display: grid;
            gap: 10px;
            justify-content: center;
        }

        .board.level-1 { grid-template-columns: repeat(4, 75px); }
        .board.level-2 { grid-template-columns: repeat(4, 75px); }
        .board.level-3 { grid-template-columns: repeat(6, 70px); }

        .card {
            width: 100%;
            height: 75px;
            background-color: #222f3e;
            border-radius: 12px;
            cursor: pointer;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            transition: transform 0.2s, border 0.2s;
            position: relative;
        }

        .card:hover { 
            transform: scale(1.05);
            border: 2px solid #00d2d3;
        }

        .card-content {
            width: 100%;
            height: 100%;
            display: none;
            justify-content: center;
            align-items: center;
            font-size: 34px;
            pointer-events: none;
        }

        .card.flipped { border: 2px solid #00d2d3; }
        .card.flipped .card-content { display: flex; }

        .card.matched {
            border: 2px solid #2ed573;
            opacity: 0.7;
            cursor: default;
        }
        .card.matched .card-content { display: flex; }

        .card.joy-selected {
            border: 3px solid #ff9f43 !important;
            transform: scale(1.08);
            box-shadow: 0 0 15px #ff9f43;
        }

        .btn {
            padding: 8px 16px;
            background: #10ac84;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="brand-header">
        <div class="brand-logo">🎮</div>
        <div class="brand-title">
            <h1>Game Development</h1>
            <p style="font-size: 11px; color: #8395a7;">Aesthetic Matching Project</p>
        </div>
    </div>

    <div id="gamepadStatus" style="font-size: 11px; padding: 4px 12px; border-radius: 10px; background: rgba(255, 255, 255, 0.1); color: #c8d6e5; margin-bottom: 10px; font-weight: bold;">
        🖱️ Mode: Mouse / Touch Screen
    </div>

    <div class="game-panel">
        <div class="char-box">
            <div class="char-avatar">🤠</div>
            <span class="char-name">PLAYER</span>
        </div>

        <div class="stats-center">
            <div id="levelText" style="font-size: 12px; color: #00d2d3; font-weight: bold;">LEVEL 1</div>
            <div class="stat-badge">⏱️ Waktu: <span id="timer">40</span>s</div>
            <div class="stat-badge">🏆 Skor: <span id="score">0</span></div>
        </div>

        <div class="char-box">
            <div class="char-avatar" style="border-color: #ff4757;">👾</div>
            <span class="char-name" style="color: #ff4757;">MUSUH</span>
        </div>
    </div>

    <div class="board level-1" id="board"></div>

    <button class="btn" onclick="toggleAudio()">🎵 Suara On/Off</button>

    <script>
        // Simbol Estetik Generatif (Tanpa Butuh File Gambar)
        const allItems = ['💎', '🚀', '🔥', '🎨', '🌟', '🔮', '🎧', '⚡', '🌙', '🍀', '🍕', '🔑'];

        let currentLevel = 1;
        let score = 0;
        let timeLeft = 40;
        let timerInterval = null;
        let flippedCards = [];
        let matchedCount = 0;
        let canClick = true;
        let currentDeck = [];
        let joyIndex = -1;

        const timerEl = document.getElementById('timer');
        const scoreEl = document.getElementById('score');
        const board = document.getElementById('board');
        const levelText = document.getElementById('levelText');
        const gamepadStatus = document.getElementById('gamepadStatus');

        const levelConfig = {
            1: { pairs: 3, hasEnemy: false, time: 40, gridClass: 'level-1', name: 'LEVEL 1: MUDAH', cols: 4 },
            2: { pairs: 5, hasEnemy: true,  time: 45, gridClass: 'level-2', name: 'LEVEL 2: AWAS MUSUH! 👾', cols: 4 },
            3: { pairs: 10, hasEnemy: true, time: 60, gridClass: 'level-3', name: 'LEVEL 3: MASTER 🏆', cols: 6 }
        };

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let isAudioMuted = false;

        function playSound(freq, type = 'sine', duration = 0.15) {
            if (isAudioMuted) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
            osc.stop(audioCtx.currentTime + duration);
        }

        function toggleAudio() {
            isAudioMuted = !isAudioMuted;
            alert(isAudioMuted ? "Suara Dimatikan 🔇" : "Suara Diaktifkan 🔊");
        }

        function startLevel(level) {
            clearInterval(timerInterval);
            board.innerHTML = '';
            flippedCards = [];
            matchedCount = 0;
            canClick = true;
            joyIndex = -1;

            const config = levelConfig[level];
            timeLeft = config.time;
            timerEl.innerText = timeLeft;
            levelText.innerText = config.name;
            board.className = `board ${config.gridClass}`;

            let selectedItems = allItems.slice(0, config.pairs);
            currentDeck = [];

            selectedItems.forEach(item => {
                currentDeck.push({ type: 'item', val: item });
                currentDeck.push({ type: 'item', val: item });
            });

            if (config.hasEnemy) {
                currentDeck.push({ type: 'enemy', val: '👾' });
                currentDeck.push({ type: 'enemy', val: '👾' });
            }

            currentDeck.sort(() => Math.random() - 0.5);

            currentDeck.forEach((item, index) => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.type = item.type;
                card.dataset.value = item.val;

                const content = document.createElement('div');
                content.classList.add('card-content');
                content.innerText = item.val;
                if(item.type === 'enemy') content.style.background = '#ff4757';

                card.appendChild(content);

                card.onclick = function() {
                    joyIndex = -1; 
                    updateJoystickHighlight();
                    triggerCardFlip(this);
                };

                board.appendChild(card);
            });

            timerInterval = setInterval(() => {
                timeLeft--;
                timerEl.innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    playSound(150, 'sawtooth', 0.5);
                    alert('⏳ Waktu Habis! Coba lagi!');
                    startLevel(currentLevel);
                }
            }, 1000);
        }

        function triggerCardFlip(card) {
            if (!canClick || card.classList.contains('flipped') || card.classList.contains('matched')) return;

            playSound(400, 'sine', 0.1);
            card.classList.add('flipped');

            if (card.dataset.type === 'enemy') {
                playSound(120, 'sawtooth', 0.4);
                score = Math.max(0, score - 25);
                scoreEl.innerText = score;
                canClick = false;

                setTimeout(() => {
                    alert('👾 JEBAKAN MUSUH! Skor berkurang -25!');
                    card.classList.remove('flipped');
                    canClick = true;
                }, 500);
                return;
            }

            flippedCards.push(card);

            if (flippedCards.length === 2) {
                checkMatch();
            }
        }

        function checkMatch() {
            const [card1, card2] = flippedCards;

            if (card1.dataset.value === card2.dataset.value) {
                playSound(600, 'sine', 0.2);
                card1.classList.add('matched');
                card2.classList.add('matched');
                
                score += 20;
                scoreEl.innerText = score;
                
                flippedCards = [];
                matchedCount += 2;

                const totalItemCards = currentDeck.filter(i => i.type === 'item').length;

                if (matchedCount === totalItemCards) {
                    clearInterval(timerInterval);
                    playSound(800, 'triangle', 0.4);

                    setTimeout(() => {
                        if (currentLevel < 3) {
                            alert(`🎉 Level ${currentLevel} Selesai!\nSkor Saat Ini: ${score}`);
                            currentLevel++;
                            startLevel(currentLevel);
                        } else {
                            alert(`🏆 SELAMAT! Kamu Menamatkan Seluruh Level!\nSkor Akhir: ${score}`);
                        }
                    }, 400);
                }
            } else {
                playSound(200, 'square', 0.2);
                canClick = false;

                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    flippedCards = [];
                    canClick = true;
                }, 800);
            }
        }

        let lastAxisMove = 0;

        function updateJoystickHighlight() {
            const cards = document.querySelectorAll('.card');
            cards.forEach((c, idx) => {
                if (idx === joyIndex) c.classList.add('joy-selected');
                else c.classList.remove('joy-selected');
            });
        }

        function pollGamepad() {
            const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
            let gp = gamepads[0];

            if (gp) {
                gamepadStatus.innerText = `🕹️ Joystick Terhubung: ${gp.id.substring(0, 18)}...`;

                const cols = levelConfig[currentLevel].cols;
                const totalCards = currentDeck.length;
                const now = Date.now();

                if (now - lastAxisMove > 200) {
                    let axisX = gp.axes[0] || (gp.buttons[14]?.pressed ? -1 : gp.buttons[15]?.pressed ? 1 : 0);
                    let axisY = gp.axes[1] || (gp.buttons[12]?.pressed ? -1 : gp.buttons[13]?.pressed ? 1 : 0);

                    if (axisX < -0.5 || axisX > 0.5 || axisY < -0.5 || axisY > 0.5) {
                        if (joyIndex === -1) joyIndex = 0;
                        
                        if (axisX < -0.5 && joyIndex % cols !== 0) joyIndex--;
                        else if (axisX > 0.5 && (joyIndex + 1) % cols !== 0 && joyIndex + 1 < totalCards) joyIndex++;
                        else if (axisY < -0.5 && joyIndex - cols >= 0) joyIndex -= cols;
                        else if (axisY > 0.5 && joyIndex + cols < totalCards) joyIndex += cols;

                        lastAxisMove = now;
                        updateJoystickHighlight();
                    }
                }

                if (gp.buttons[0].pressed && joyIndex !== -1) {
                    const cards = document.querySelectorAll('.card');
                    if (cards[joyIndex] && canClick) {
                        triggerCardFlip(cards[joyIndex]);
                        canClick = false; 
                        setTimeout(() => canClick = true, 300);
                    }
                }
            } else {
                gamepadStatus.innerText = "🖱️ Mode: Mouse / Touch Screen Active";
            }

            requestAnimationFrame(pollGamepad);
        }

        startLevel(currentLevel);
        requestAnimationFrame(pollGamepad);
    </script>
</body>
</html>
