<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAME MENCOCOKKAN GAMBAR - Matching Project</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            user-select: none;
            overflow-x: hidden;
        }

        /* BRANDING HEADER */
        .brand-header {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            margin-bottom: 15px;
        }

        .brand-title h1 {
            font-size: 18px;
            color: #00d2d3;
            text-transform: uppercase;
        }

        .brand-title p {
            font-size: 11px;
            color: #8395a7;
        }

        /* 🏠 HALAMAN UTAMA */
        #home-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
            max-width: 450px;
            background: rgba(255, 255, 255, 0.03);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .main-play-btn {
            padding: 14px 35px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            color: #fff;
            background: linear-gradient(135deg, #10ac84 0%, #1dd1a1 100%);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(16, 172, 132, 0.4);
            margin-top: 20px;
            transition: transform 0.2s;
        }

        .main-play-btn:hover {
            transform: scale(1.05);
        }

        /* 🎮 ARENA GAME */
        #game-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 500px;
        }

        .game-panel {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            background: rgba(255, 255, 255, 0.07);
            padding: 12px 20px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            margin-bottom: 18px;
        }

        .char-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #222f3e;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            border: 2px solid #00d2d3;
        }

        .stats-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .stat-badge {
            background: rgba(0, 0, 0, 0.4);
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
        }

        /* 🔲 PAPAN KARTU */
        .board {
            display: grid;
            gap: 10px;
            justify-content: center;
            margin-bottom: 15px;
            width: 100%;
        }

        .board.level-1 { grid-template-columns: repeat(3, 80px); }
        .board.level-2 { grid-template-columns: repeat(4, 70px); }
        .board.level-3 { grid-template-columns: repeat(6, 55px); }

        .card {
            height: 75px;
            background: #222f3e;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            border: 2px solid rgba(255,255,255,0.1);
            position: relative;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: scale(1.05);
        }

        /* Cover belakang (sebelum diklik) */
        .card::before {
            content: "❓";
            font-size: 20px;
            opacity: 0.6;
        }

        /* Tampilan saat kartu dibalik / diklik */
        .card img {
            width: 75%;
            height: 75%;
            object-fit: contain;
            display: none;
        }

        .card.flipped::before, .card.matched::before {
            display: none;
        }

        .card.flipped, .card.matched {
            background: #ffffff;
            border-color: #00d2d3;
        }

        .card.flipped img, .card.matched img {
            display: block;
        }

        .card.matched {
            border-color: #2ed573;
            opacity: 0.6;
            cursor: default;
        }

        .card.enemy.flipped {
            background: #ff4757 !important;
        }
    </style>
</head>
<body>

    <div class="brand-header">
        <span style="font-size: 24px;">🎮</span>
        <div class="brand-title">
            <h1>Game Development</h1>
            <p>Aesthetic Matching Project</p>
        </div>
    </div>

    <!-- BERANDA -->
    <div id="home-screen">
        <p style="color: #c8d6e5; margin-bottom: 10px;">Temukan pasangan gambar yang cocok sebelum waktu habis!</p>
        <button class="main-play-btn" onclick="mulaiPermainan()">Mulai Permainan</button>
    </div>

    <!-- ARENA GAME -->
    <div id="game-screen">
        <div class="game-panel">
            <div style="text-align:center;">
                <div class="char-avatar">🤠</div>
                <!-- NAMA SUDAH DIGANTI MENJADI 'SAYA' -->
                <span id="playerName" style="font-size: 11px; font-weight: bold; letter-spacing: 1px;">SAYA</span>
            </div>

            <div class="stats-center">
                <div id="levelText" style="color:#00d2d3; font-weight:bold; font-size:12px;">LEVEL 1</div>
                <div class="stat-badge">⏱️ Waktu: <span id="timer">60</span>s</div>
                <div class="stat-badge">🏆 Skor: <span id="score">0</span></div>
            </div>

            <div style="text-align:center;">
                <div class="char-avatar" style="border-color:#ff4757;">👾</div>
                <span style="font-size: 11px; font-weight: bold; color:#ff4757; letter-spacing: 1px;">MUSUH</span>
            </div>
        </div>

        <div class="board level-1" id="board"></div>
    </div>

    <script>
        // URL Gambar Online (Pasti Muncul)
        const onlineImages = [
            'https://cdn-icons-png.flaticon.com/512/742/742751.png',
            'https://cdn-icons-png.flaticon.com/512/3081/3081840.png',
            'https://cdn-icons-png.flaticon.com/512/616/616408.png',
            'https://cdn-icons-png.flaticon.com/512/414/414004.png',
            'https://cdn-icons-png.flaticon.com/512/2909/2909762.png',
            'https://cdn-icons-png.flaticon.com/512/1046/1046784.png',
            'https://cdn-icons-png.flaticon.com/512/2972/2972531.png',
            'https://cdn-icons-png.flaticon.com/512/869/869869.png'
        ];

        const enemyImageUrl = 'https://cdn-icons-png.flaticon.com/512/1216/1216597.png';

        let currentLevel = 1;
        let score = 0;
        let timeLeft = 60;
        let timerInterval = null;
        let flippedCards = [];
        let matchedCount = 0;
        let canClick = true;

        const levelConfig = {
            1: { pairs: 3, hasEnemy: false, gridClass: 'level-1', name: 'LEVEL 1' },
            2: { pairs: 4, hasEnemy: true,  gridClass: 'level-2', name: 'LEVEL 2: AWAS MUSUH! 👾' },
            3: { pairs: 8, hasEnemy: true,  gridClass: 'level-3', name: 'LEVEL 3: MASTER' }
        };

        function mulaiPermainan() {
            document.getElementById('home-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
            currentLevel = 1;
            score = 0;
            document.getElementById('score').innerText = score;
            startLevel(currentLevel);
        }

        function startLevel(level) {
            clearInterval(timerInterval);
            const board = document.getElementById('board');
            board.innerHTML = '';
            flippedCards = [];
            matchedCount = 0;
            canClick = true;

            const config = levelConfig[level];
            timeLeft = 60;
            document.getElementById('timer').innerText = timeLeft;
            document.getElementById('levelText').innerText = config.name;
            board.className = `board ${config.gridClass}`;

            let deck = [];
            let selectedImages = onlineImages.slice(0, config.pairs);

            selectedImages.forEach((imgUrl, idx) => {
                deck.push({ type: 'img', url: imgUrl, id: idx });
                deck.push({ type: 'img', url: imgUrl, id: idx });
            });

            if (config.hasEnemy) {
                deck.push({ type: 'enemy', url: enemyImageUrl, id: 'enemy' });
                deck.push({ type: 'enemy', url: enemyImageUrl, id: 'enemy' });
            }

            deck.sort(() => Math.random() - 0.5);

            deck.forEach(item => {
                const card = document.createElement('div');
                card.classList.add('card');
                if(item.type === 'enemy') card.classList.add('enemy');
                card.dataset.id = item.id;
                card.dataset.type = item.type;

                const img = document.createElement('img');
                img.src = item.url;

                card.appendChild(img);
                card.onclick = () => flipCard(card);
                board.appendChild(card);
            });

            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    alert('⏳ Waktu Habis! Mengulang level...');
                    startLevel(currentLevel);
                }
            }, 1000);
        }

        function flipCard(card) {
            if (!canClick || card.classList.contains('flipped') || card.classList.contains('matched')) return;

            card.classList.add('flipped');

            if (card.dataset.type === 'enemy') {
                score = Math.max(0, score - 10);
                document.getElementById('score').innerText = score;
                canClick = false;
                setTimeout(() => {
                    alert('👾 JEBAKAN MUSUH! Skor Anda berkurang -10');
                    card.classList.remove('flipped');
                    canClick = true;
                }, 400);
                return;
            }

            flippedCards.push(card);

            if (flippedCards.length === 2) {
                canClick = false;
                const [card1, card2] = flippedCards;

                if (card1.dataset.id === card2.dataset.id) {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    score += 10;
                    document.getElementById('score').innerText = score;
                    flippedCards = [];
                    matchedCount += 2;
                    canClick = true;

                    const totalImages = levelConfig[currentLevel].pairs * 2;
                    if (matchedCount === totalImages) {
                        clearInterval(timerInterval);
                        setTimeout(() => {
                            if (currentLevel < 3) {
                                alert(`🎉 LEVEL SELESAI!\nSkor: ${score}\nLanjut ke Level ${currentLevel + 1}`);
                                currentLevel++;
                                startLevel(currentLevel);
                            } else {
                                alert(`🏆 SELAMAT! ANDA MENANG!\nSkor Akhir: ${score}`);
                                location.reload();
                            }
                        }, 300);
                    }
                } else {
                    setTimeout(() => {
                        card1.classList.remove('flipped');
                        card2.classList.remove('flipped');
                        flippedCards = [];
                        canClick = true;
                    }, 700);
                }
            }
        }
    </script>
</body>
</html>
