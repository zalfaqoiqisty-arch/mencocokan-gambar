<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 📌 JUDUL UNTUK BROWSER & PREVIEW LINK WHATSAPP -->
    <title>GAME MENCOCOKKAN GAMBAR - Matching Project</title>
    <meta property="og:title" content="GAME MENCOCOKKAN GAMBAR - Matching Project">
    <meta property="og:description" content="Aesthetic Matching Project">
    <meta property="og:type" content="website">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            user-select: none;
            overflow-x: hidden;
        }

        /* 📌 HEADER MELEBAR KE POJOK KIRI DAN KANAN */
        .brand-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.05);
            padding: 12px 25px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            margin-bottom: 20px;
            width: 100%;
            max-width: 900px;
        }

        .brand-header img {
            width: 45px;
            height: 45px;
            object-fit: contain;
            border-radius: 8px;
        }

        .brand-title {
            text-align: center;
            flex-grow: 1;
            padding: 0 15px;
        }

        .brand-title h1 {
            font-size: 18px;
            color: #00d2d3;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .brand-title p {
            font-size: 12px;
            color: #8395a7;
        }

        /* 🏠 HALAMAN UTAMA */
        #home-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.03);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: 20px;
        }

        .main-play-btn {
            padding: 14px 35px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            color: #fff;
            background: linear-gradient(135deg, #10ac84 0%, #1dd1a1 100%);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(16, 172, 132, 0.4);
            margin-top: 20px;
            transition: transform 0.2s;
        }

        .main-play-btn:hover {
            transform: scale(1.05);
        }

        /* 🎮 ARENA GAME */
        #game-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 550px;
        }

        .game-panel {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            background: rgba(255, 255, 255, 0.07);
            padding: 15px 25px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            margin-bottom: 20px;
        }

        .char-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .char-avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: #222f3e;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid #00d2d3;
            overflow: hidden;
        }

        .char-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .stats-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .stat-badge {
            background: rgba(0, 0, 0, 0.4);
            padding: 5px 14px;
            border-radius: 15px;
            font-size: 13px;
            font-weight: bold;
        }

        /* 🔲 PAPAN KARTU */
        .board {
            display: grid;
            gap: 10px;
            justify-content: center;
            margin-bottom: 15px;
            width: 100%;
        }

        .board.level-1 { grid-template-columns: repeat(3, 85px); }
        .board.level-2 { grid-template-columns: repeat(4, 75px); }
        .board.level-3 { grid-template-columns: repeat(6, 60px); }

        .card {
            height: 80px;
            background: #222f3e;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            border: 2px solid rgba(255,255,255,0.1);
            position: relative;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: scale(1.05);
        }

        .card::before {
            content: "❓";
            font-size: 22px;
            opacity: 0.6;
        }

        .card img {
            width: 75%;
            height: 75%;
            object-fit: contain;
            display: none;
        }

        .card.flipped::before, .card.matched::before {
            display: none;
        }

        .card.flipped, .card.matched {
            background: #ffffff;
            border-color: #00d2d3;
        }

        .card.flipped img, .card.matched img {
            display: block;
        }

        .card.matched {
            border-color: #2ed573;
            opacity: 0.6;
            cursor: default;
        }

        .card.enemy.flipped {
            background: #ff4757 !important;
        }
    </style>
</head>
<body>

    <!-- BRANDING HEADER -->
    <div class="brand-header">
        <img src="logoSmk.jpeg" alt="Logo SMK">
        
        <div class="brand-title">
            <h1>GAME MENCOCOKKAN GAMBAR</h1>
            <p>Aesthetic Matching Project</p>
        </div>

        <img src="logojurusan.jpeg" alt="Logo Jurusan">
    </div>

    <!-- BERANDA -->
    <div id="home-screen">
        <p style="color: #c8d6e5; margin-bottom: 10px;">Temukan pasangan gambar yang cocok sebelum waktu habis!</p>
        <button class="main-play-btn" onclick="mulaiPermainan()">Mulai Permainan</button>
    </div>

    <!-- ARENA GAME -->
    <div id="game-screen">
        <div class="game-panel">
            <!-- KARAKTER SAYA (MENGGUNAKAN LOGO hkihhcgfk) -->
            <div class="char-box">
                <div class="char-avatar">
                    <img src="hkihhcgfk.jpeg" alt="Logo Zalfa" onerror="this.onerror=null; this.src='hkihhcgfk.png';">
                </div>
                <span id="playerName" style="font-size: 11px; font-weight: bold; letter-spacing: 1px;">SAYA</span>
            </div>

            <!-- STATUS TENGAH -->
            <div class="stats-center">
                <div id="levelText" style="color:#00d2d3; font-weight:bold; font-size:13px;">LEVEL 1</div>
                <div class="stat-badge">⏱️ Waktu: <span id="timer">70</span>s</div>
                <div class="stat-badge">🏆 Skor: <span id="score">0</span></div>
            </div>

            <!-- KARAKTER MUSUH (PAKAI LOGO ppm.jpeg / MOKO) -->
            <div class="char-box">
                <div class="char-avatar" style="border-color:#ff4757;">
                    <img src="ppm.jpeg" alt="Logo Moko" onerror="this.onerror=null; this.src='https://cdn-icons-png.flaticon.com/512/1216/1216597.png';">
                </div>
                <span style="font-size: 11px; font-weight: bold; color:#ff4757; letter-spacing: 1px;">MUSUH</span>
                <span id="enemyProgress" style="font-size: 10px; color: #ff6b6b; font-weight: bold;">Status: 0%</span>
            </div>
        </div>

        <div class="board level-1" id="board"></div>
    </div>

    <script>
        // 🔊 AUDIO GENERATOR (Web Audio API)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'flip') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (type === 'match') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.1);
                osc.frequency.setValueAtTime(783.99, now + 0.2);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                osc.start(now);
                osc.stop(now + 0.35);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.setValueAtTime(120, now + 0.15);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'win') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.15);
                osc.frequency.setValueAtTime(783.99, now + 0.30);
                osc.frequency.setValueAtTime(1046.50, now + 0.45);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.7);
                osc.start(now);
                osc.stop(now + 0.7);
            } else if (type === 'lose') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.setValueAtTime(250, now + 0.2);
                osc.frequency.setValueAtTime(200, now + 0.4);
                osc.frequency.setValueAtTime(150, now + 0.6);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.8);
                osc.start(now);
                osc.stop(now + 0.8);
            }
        }

        const onlineImages = [
            'https://cdn-icons-png.flaticon.com/512/742/742751.png',
            'https://cdn-icons-png.flaticon.com/512/3081/3081840.png',
            'https://cdn-icons-png.flaticon.com/512/616/616408.png',
            'https://cdn-icons-png.flaticon.com/512/414/414004.png',
            'https://cdn-icons-png.flaticon.com/512/2909/2909762.png',
            'https://cdn-icons-png.flaticon.com/512/1046/1046784.png',
            'https://cdn-icons-png.flaticon.com/512/2972/2972531.png',
            'https://cdn-icons-png.flaticon.com/512/869/869869.png'
        ];

        // Gambar jebakan musuh menggunakan ppm.jpeg (Logo Moko)
        const enemyImageUrl = 'ppm.jpeg';

        let currentLevel = 1;
        let score = 0;
        let timeLeft = 70;
        let timerInterval = null;
        let enemyInterval = null;
        let enemyProgressPercent = 0;
        let flippedCards = [];
        let matchedCount = 0;
        let canClick = true;

        const levelConfig = {
            1: { pairs: 3, hasEnemy: false, gridClass: 'level-1', name: 'LEVEL 1' },
            2: { pairs: 4, hasEnemy: true,  gridClass: 'level-2', name: 'LEVEL 2: AWAS MUSUH! 👾' },
            3: { pairs: 8, hasEnemy: true,  gridClass: 'level-3', name: 'LEVEL 3: MASTER' }
        };

        function mulaiPermainan() {
            playSound('flip');
            document.getElementById('home-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
            currentLevel = 1;
            score = 0;
            document.getElementById('score').innerText = score;
            startLevel(currentLevel);
        }

        function startLevel(level) {
            clearInterval(timerInterval);
            clearInterval(enemyInterval);
            const board = document.getElementById('board');
            board.innerHTML = '';
            flippedCards = [];
            matchedCount = 0;
            canClick = true;
            enemyProgressPercent = 0;

            const config = levelConfig[level];
            timeLeft = 70;
            document.getElementById('timer').innerText = timeLeft;
            document.getElementById('levelText').innerText = config.name;
            document.getElementById('enemyProgress').innerText = `Status: 0%`;
            board.className = `board ${config.gridClass}`;

            let deck = [];
            let selectedImages = onlineImages.slice(0, config.pairs);

            selectedImages.forEach((imgUrl, idx) => {
                deck.push({ type: 'img', url: imgUrl, id: idx });
                deck.push({ type: 'img', url: imgUrl, id: idx });
            });

            if (config.hasEnemy) {
                deck.push({ type: 'enemy', url: enemyImageUrl, id: 'enemy' });
                deck.push({ type: 'enemy', url: enemyImageUrl, id: 'enemy' });
            }

            deck.sort(() => Math.random() - 0.5);

            deck.forEach(item => {
                const card = document.createElement('div');
                card.classList.add('card');
                if(item.type === 'enemy') card.classList.add('enemy');
                card.dataset.id = item.id;
                card.dataset.type = item.type;

                const img = document.createElement('img');
                img.src = item.url;
                img.onerror = function() {
                    if(item.type === 'enemy') this.src = 'https://cdn-icons-png.flaticon.com/512/1216/1216597.png';
                };

                card.appendChild(img);
                card.onclick = () => flipCard(card);
                board.appendChild(card);
            });

            // Timer Utama 70 Detik
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    clearInterval(enemyInterval);
                    playSound('lose');
                    alert('⏳ Waktu Habis! Mengulang level...');
                    startLevel(currentLevel);
                }
            }, 1000);

            // Progress Musuh
            if (config.hasEnemy) {
                enemyInterval = setInterval(() => {
                    enemyProgressPercent += 2;
                    if (enemyProgressPercent > 100) enemyProgressPercent = 100;
                    document.getElementById('enemyProgress').innerText = `Progress: ${enemyProgressPercent}%`;

                    if (enemyProgressPercent >= 100) {
                        clearInterval(timerInterval);
                        clearInterval(enemyInterval);
                        playSound('lose');
                        alert('👾 Musuh telah menyelesaikan papan terlebih dahulu! Kamu Kalah!');
                        startLevel(currentLevel);
                    }
                }, 1000);
            }
        }

        function flipCard(card) {
            if (!canClick || card.classList.contains('flipped') || card.classList.contains('matched')) return;

            card.classList.add('flipped');

            if (card.dataset.type === 'enemy') {
                playSound('wrong');
                score = Math.max(0, score - 10);
                document.getElementById('score').innerText = score;
                canClick = false;
                setTimeout(() => {
                    alert('👾 JEBAKAN MUSUH! Skor Anda berkurang -10');
                    card.classList.remove('flipped');
                    canClick = true;
                }, 400);
                return;
            }

            playSound('flip');
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                canClick = false;
                const [card1, card2] = flippedCards;

                if (card1.dataset.id === card2.dataset.id) {
                    playSound('match');
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    score += 10;
                    document.getElementById('score').innerText = score;
                    flippedCards = [];
                    matchedCount += 2;
                    canClick = true;

                    const totalImages = levelConfig[currentLevel].pairs * 2;
                    if (matchedCount === totalImages) {
                        clearInterval(timerInterval);
                        clearInterval(enemyInterval);
                        playSound('win');
                        setTimeout(() => {
                            if (currentLevel < 3) {
                                alert(`🎉 LEVEL SELESAI!\nSkor: ${score}\nLanjut ke Level ${currentLevel + 1}`);
                                currentLevel++;
                                startLevel(currentLevel);
                            } else {
                                alert(`🏆 SELAMAT! ANDA MENANG!\nSkor Akhir: ${score}`);
                                location.reload();
                            }
                        }, 300);
                    }
                } else {
                    setTimeout(() => {
                        playSound('wrong');
                        card1.classList.remove('flipped');
                        card2.classList.remove('flipped');
                        flippedCards = [];
                        canClick = true;
                    }, 700);
                }
            }
        }
    </script>
</body>
</html>
