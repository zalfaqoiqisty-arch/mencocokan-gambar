<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Development - Matching Project</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            user-select: none;
            overflow-x: hidden;
        }

        /* 🖼️ GAYA UMUM LOGO & BRANDING */
        .all-logos-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            width: 100%;
            max-width: 600px;
        }

        .emblem-row {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
        }

        .emblem-img {
            width: 50px;
            height: 50px;
            object-fit: contain;
            filter: drop-shadow(0 2px 4px rgba(255,255,255,0.2));
        }

        .brand-header {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(255, 255, 255, 0.03);
            padding: 15px 25px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .brand-logo-main {
            width: 70px;
            height: 70px;
            object-fit: contain;
            border-radius: 12px;
            filter: drop-shadow(0 4px 8px rgba(0,210,211,0.5));
        }

        .brand-title h1 {
            font-size: 24px;
            color: #00d2d3;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-shadow: 0 0 10px rgba(0,210,211,0.5);
        }

        .brand-title p {
            font-size: 13px;
            color: #8395a7;
        }

        /* 🏠 GAYA HALAMAN BERANDA (MAIN MENU) */
        #home-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            max-width: 600px;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .welcome-text {
            font-size: 18px;
            color: #c8d6e5;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .main-play-btn {
            padding: 18px 40px;
            font-size: 20px;
            font-weight: bold;
            text-transform: uppercase;
            color: #fff;
            background: linear-gradient(135deg, #10ac84 0%, #1dd1a1 100%);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(16, 172, 132, 0.4);
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        .main-play-btn:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 15px 30px rgba(16, 172, 132, 0.6);
        }

        .main-play-btn:active {
            transform: translateY(1px);
        }

        /* 🎮 GAYA AREA PERMAINAN (GAMEPLAY) */
        #game-screen {
            display: none; /* Sembunyikan dulu */
            flex-direction: column;
            align-items: center;
            width: 100%;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        /* Container stats & gamepad saat main */
        .game-meta-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 520px;
        }

        #gamepadStatus {
            font-size: 11px;
            padding: 5px 15px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            color: #8395a7;
            font-weight: bold;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .game-panel {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(10px);
            padding: 15px 25px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
        }

        .char-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .char-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #222f3e;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            border: 2px solid #00d2d3;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(0,210,211,0.3);
        }

        .char-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .char-name {
            font-size: 12px;
            font-weight: bold;
            color: #c8d6e5;
            letter-spacing: 0.5px;
        }

        .stats-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        #levelText {
            font-size: 14px;
            color: #00d2d3;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .stat-badge {
            background: rgba(0, 0, 0, 0.4);
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
        }

        /* 🔲 GAYA KARTU */
        .board {
            display: grid;
            gap: 12px;
            justify-content: center;
            margin-bottom: 20px;
        }

        /* Responsif Grid */
        .board.level-1 { grid-template-columns: repeat(4, minmax(70px, 85px)); }
        .board.level-2 { grid-template-columns: repeat(4, minmax(70px, 85px)); }
        .board.level-3 { grid-template-columns: repeat(6, minmax(50px, 75px)); }

        .card {
            aspect-ratio: 1 / 1;
            background-color: #222f3e;
            border-radius: 12px;
            cursor: pointer;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 5px 10px rgba(0,0,0,0.3);
            transition: transform 0.2s, border 0.2s, box-shadow 0.2s;
            position: relative;
            border: 2px solid transparent;
        }

        .card:hover { 
            transform: translateY(-3px) scale(1.03);
            border: 2px solid #00d2d3;
            box-shadow: 0 8px 15px rgba(0,210,211,0.2);
        }

        .card img, .card .enemy-icon {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
            pointer-events: none;
        }

        .card .enemy-icon {
            font-size: 40px;
            background: #ff4757;
            display: none;
            align-items: center;
            justify-content: center;
        }

        /* Status Kartu */
        .card.flipped { border: 2px solid #00d2d3; transform: scale(1.05); }
        .card.flipped img, .card.flipped .enemy-icon { display: flex; }

        .card.matched {
            border: 2px solid #2ed573;
            opacity: 0.6;
            cursor: default;
            transform: scale(1);
            box-shadow: none;
        }
        .card.matched img { display: block; }

        /* Tombol Suara saat main */
        .in-game-btn {
            padding: 8px 18px;
            background: rgba(255, 255, 255, 0.05);
            color: #8395a7;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            transition: all 0.2s;
        }
        .in-game-btn:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }

        /* Utilitas Sembunyi */
        .hidden { display: none !important; }
        .fade-in { opacity: 1 !important; transform: translateY(0) !important; }

    </style>
</head>
<body>

    <!-- =========================================
         🏠 AREA BERANDA (MAIN MENU)
         ========================================= -->
    <div id="home-screen">
        <!-- Komponen Branding (Semua Logo) -->
        <div class="all-logos-container">
            <div class="emblem-row">
                <!-- Logo Sekolah -->
                <img src="images/logo-sekolah.png" alt="SMKN 1 Sanden" class="emblem-img" onerror="this.style.display='none'">
                <!-- Logo RPL -->
                <img src="images/logo-rpl.png" alt="RPL" class="emblem-img" onerror="this.style.display='none'">
            </div>
            
            <div class="brand-header">
                <!-- Logo Moko -->
                <img src="images/logo-moko.png" alt="Logo Moko" class="brand-logo-main" onerror="this.src='https://cdn-icons-png.flaticon.com/512/808/808439.png'">
                <div class="brand-title">
                    <h1>Game Development</h1>
                    <p>Aesthetic Matching Project</p>
                </div>
            </div>
        </div>

        <div class="welcome-text">
            Selamat Datang di Permainan Mencocokkan Gambar.<br>
            Uji ingatan Anda dan selesaikan semua level dalam waktu 1 menit!
        </div>

        <button class="main-play-btn" onclick="tambahKePermainan()">Mulai Permainan</button>
    </div>


    <!-- =========================================
         🎮 AREA PERMAINAN (GAMEPLAY)
         ========================================= -->
    <div id="game-screen">
        <!-- Header Branding Tetap Tampil saat Main -->
        <div class="all-logos-container" style="margin-bottom: 15px; scale: 0.8; transform-origin: top;">
            <div class="emblem-row">
                <img src="images/logo-sekolah.png" alt="SMKN 1 Sanden" class="emblem-img" onerror="this.style.display='none'">
                <img src="images/logo-rpl.png" alt="RPL" class="emblem-img" onerror="this.style.display='none'">
            </div>
            <div class="brand-header" style="padding: 10px 20px;">
                <img src="images/logo-moko.png" alt="Logo Moko" class="brand-logo-main" style="width: 50px; height: 50px;" onerror="this.src='https://cdn-icons-png.flaticon.com/512/808/808439.png'">
                <div class="brand-title">
                    <h1 style="font-size: 18px;">Game Development</h1>
                </div>
            </div>
        </div>

        <!-- Meta info & Stats -->
        <div class="game-meta-container">
            <div id="gamepadStatus">🖱️ Mode: Mouse / Touch Screen</div>

            <div class="game-panel">
                <div class="char-box">
                    <div class="char-avatar">
                        <!-- Logo Zalfa untuk Player -->
                        <img src="images/logo-zalfa.png" alt="Zalfa" onerror="this.style.display='none'; this.parentElement.innerText='🤠';">
                    </div>
                    <span class="char-name">ZALFA</span>
                </div>

                <div class="stats-center">
                    <div id="levelText">LEVEL 1</div>
                    <div class="stat-badge">⏱️ Waktu: <span id="timer">60</span>s</div>
                    <div class="stat-badge">🏆 Skor: <span id="score">0</span></div>
                </div>

                <div class="char-box">
                    <div class="char-avatar" style="border-color: #ff4757;">👾</div>
                    <span class="char-name" style="color: #ff4757;">MUSUH</span>
                </div>
            </div>
        </div>

        <!-- Arena Kartu -->
        <div class="board level-1" id="board"></div>

        <button class="in-game-btn" onclick="toggleAudio()">🎵 Suara On/Off</button>
    </div>


    <!-- =========================================
         🛠️ SKRIP LOGIKA PERMAINAN
         ========================================= -->
    <script>
        // 1. DATA ASET GAMBAR KARTU
        const allImages = [
            'images/1.png', 'images/2.png', 'images/3.png', 'images/4.png',
            'images/5.png', 'images/6.png', 'images/7.png', 'images/8.png',
            'images/9.png', 'images/10.png', 'images/11.png', 'images/12.png'
        ];

        // Status Game Global
        let currentLevel = 1;
        let score = 0;
        let timeLeft = 60; // 1 Menit
        let timerInterval = null;
        let flippedCards = [];
        let matchedCount = 0;
        let canClick = true;
        let currentDeck = [];

        // Elemen DOM
        const homeScreen = document.getElementById('home-screen');
        const gameScreen = document.getElementById('game-screen');
        const timerEl = document.getElementById('timer');
        const scoreEl = document.getElementById('score');
        const board = document.getElementById('board');
        const levelTextEl = document.getElementById('levelText');

        // Konfigurasi Level
        const levelConfig = {
            1: { pairs: 3, hasEnemy: false, time: 60, gridClass: 'level-1', name: 'LEVEL 1: MUDAH' },
            2: { pairs: 5, hasEnemy: true,  time: 60, gridClass: 'level-2', name: 'LEVEL 2: AWAS MUSUH! 👾' },
            3: { pairs: 10, hasEnemy: true, time: 60, gridClass: 'level-3', name: 'LEVEL 3: MASTER 🏆' }
        };

        // 2. SISTEM AUDIO SINTETIS
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let isAudioMuted = false;

        function playSound(freq, type = 'sine', duration = 0.15) {
            if (isAudioMuted || audioCtx.state === 'suspended') return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
            osc.stop(audioCtx.currentTime + duration);
        }

        function toggleAudio() {
            isAudioMuted = !isAudioMuted;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            alert(isAudioMuted ? "Suara Dimatikan 🔇" : "Suara Diaktifkan 🔊");
        }

        // 3. FUNGSI TRANSISI MENU KE GAME
        function tambahKePermainan() {
            // Aktifkan Audio Context (dibutuhkan browser modern)
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            playSound(500, 'triangle', 0.3); // Suara klik mulai

            // Sembunyikan Beranda dengan efek fade
            homeScreen.style.opacity = '0';
            homeScreen.style.transform = 'scale(0.9)';
            
            setTimeout(() => {
                homeScreen.style.display = 'none';
                
                // Tampilkan Game Screen
                gameScreen.style.display = 'flex';
                
                // Trigger reflow untuk animasi
                void gameScreen.offsetWidth;
                
                gameScreen.classList.add('fade-in');

                // Mulai permainan dari level 1
                currentLevel = 1;
                score = 0;
                scoreEl.innerText = score;
                startLevel(currentLevel);
            }, 500);
        }

        // 4. LOGIKA UTAMA PERMAINAN
        function startLevel(level) {
            clearInterval(timerInterval);
            board.innerHTML = '';
            flippedCards = [];
            matchedCount = 0;
            canClick = true;

            const config = levelConfig[level];
            timeLeft = config.time;
            timerEl.innerText = timeLeft;
            levelTextEl.innerText = config.name;
            board.className = `board ${config.gridClass}`;

            // Siapkan Kartu
            let selectedImages = allImages.slice(0, config.pairs);
            currentDeck = [];

            selectedImages.forEach(img => {
                currentDeck.push({ type: 'img', val: img });
                currentDeck.push({ type: 'img', val: img });
            });

            // Tambah Musuh
            if (config.hasEnemy) {
                currentDeck.push({ type: 'enemy', val: 'ENEMY' });
                currentDeck.push({ type: 'enemy', val: 'ENEMY' });
            }

            // Acak
            currentDeck.sort(() => Math.random() - 0.5);

            // Buat Elemen Kartu
            currentDeck.forEach((item) => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.type = item.type;
                card.dataset.value = item.val;

                if (item.type === 'img') {
                    const img = document.createElement('img');
                    img.src = item.val;
                    // Fallback jika gambar kartu lokal tidak ketemu
                    img.onerror = function() { 
                        this.style.display = 'none'; 
                        this.parentElement.innerText = '🖼️'; 
                        this.parentElement.style.fontSize = '30px';
                        this.parentElement.style.color = '#8395a7';
                    };
                    card.appendChild(img);
                } else {
                    const enemy = document.createElement('div');
                    enemy.classList.add('enemy-icon');
                    enemy.innerText = '👾';
                    card.appendChild(enemy);
                }

                card.onclick = function() { triggerCardFlip(this); };
                board.appendChild(card);
            });

            // Mulai Timer
            timerInterval = setInterval(() => {
                timeLeft--;
                timerEl.innerText = timeLeft;
                if (timeLeft <= 10) timerEl.style.color = '#ff4757'; // Merah jika waktu mau habis
                else timerEl.style.color = '#fff';

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    playSound(150, 'sawtooth', 0.5);
                    alert('⏳ WAKTU HABIS!\nGame Over. Coba lagi dari level 1.');
                    
                    // Kembali ke Level 1
                    currentLevel = 1;
                    score = 0;
                    scoreEl.innerText = score;
                    startLevel(currentLevel);
                }
            }, 1000);
        }

        // 5. LOGIKA FLIP & COCOK
        function triggerCardFlip(card) {
            if (!canClick || card.classList.contains('flipped') || card.classList.contains('matched')) return;

            playSound(400, 'sine', 0.05); // Suara flip pendek
            card.classList.add('flipped');

            // CEK MUSUH
            if (card.dataset.type === 'enemy') {
                playSound(100, 'sawtooth', 0.3);
                score = Math.max(0, score - 10); // Penalti Skor
                scoreEl.innerText = score;
                canClick = false;

                setTimeout(() => {
                    alert('👾 BOOM! Jebakan Musuh!\nSkor berkurang -10.');
                    card.classList.remove('flipped');
                    canClick = true;
                }, 500);
                return;
            }

            flippedCards.push(card);

            if (flippedCards.length === 2) {
                canClick = false; // Kunci klik sebentar
                checkMatch();
            }
        }

        function checkMatch() {
            const [card1, card2] = flippedCards;

            if (card1.dataset.value === card2.dataset.value) {
                // COCOK
                playSound(600, 'sine', 0.15);
                card1.classList.add('matched');
                card2.classList.add('matched');
                
                score += 10; // Tambah Skor
                scoreEl.innerText = score;
                
                flippedCards = [];
                matchedCount += 2;
                canClick = true; // Buka kunci klik

                const totalImageCards = currentDeck.filter(item => item.type === 'img').length;

                // CEK MENANG LEVEL
                if (matchedCount === totalImageCards) {
                    clearInterval(timerInterval);
                    playSound(800, 'triangle', 0.5);

                    setTimeout(() => {
                        if (currentLevel < 3) {
                            alert(`🎉 LUAR BIASA!\nLevel ${currentLevel} Selesai.\nSkor Anda: ${score}\nWaktu Tersisa: ${timeLeft}s.\nLanjut ke Level Berikutnya!`);
                            currentLevel++;
                            startLevel(currentLevel);
                        } else {
                            // TAMAT
                            alert(`🏆 SELAMAT! ANDA MENANG!\nAnda berhasil menamatkan semua level.\nTotal Skor Akhir: ${score}\nTerima kasih telah bermain!`);
                            // Opsi: Reload untuk kembali ke beranda
                            location.reload();
                        }
                    }, 500);
                }
            } else {
                // TIDAK COCOK
                playSound(200, 'square', 0.15);
                
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    flippedCards = [];
                    canClick = true; // Buka kunci klik
                }, 800);
            }
        }
    </script>
</body>
</html>
