<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Development - Matching Project</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            user-select: none;
        }

        /* 🖼️ EMBLEM LOGO INSTANSI */
        .emblem-container {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }

        .emblem-img {
            width: 40px;
            height: 40px;
            object-fit: contain;
        }

        /* 🏆 HEADER LOGO BRANDING */
        .brand-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .brand-logo {
            width: 65px;
            height: 65px;
            object-fit: contain;
            border-radius: 12px;
            filter: drop-shadow(0 4px 8px rgba(0,210,211,0.4));
        }

        .brand-title h1 {
            font-size: 22px;
            color: #00d2d3;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* 👤 DUAL CHARACTER & PANEL STATISTIK */
        .game-panel {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 520px;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(10px);
            padding: 12px 20px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            margin-bottom: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
        }

        .char-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .char-avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: #222f3e;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            border: 2px solid #00d2d3;
            overflow: hidden;
        }

        .char-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .char-name {
            font-size: 11px;
            font-weight: bold;
            color: #c8d6e5;
        }

        .stats-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .stat-badge {
            background: rgba(0, 0, 0, 0.4);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .board {
            display: grid;
            gap: 10px;
            justify-content: center;
        }

        .board.level-1 { grid-template-columns: repeat(4, 80px); }
        .board.level-2 { grid-template-columns: repeat(4, 80px); }
        .board.level-3 { grid-template-columns: repeat(6, 75px); }

        .card {
            width: 100%;
            height: 80px;
            background-color: #222f3e;
            border-radius: 10px;
            cursor: pointer;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            transition: transform 0.2s, border 0.2s;
            position: relative;
        }

        .card:hover { 
            transform: scale(1.05);
            border: 2px solid #00d2d3;
        }

        .card img, .card .enemy-icon {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
            pointer-events: none;
        }

        .card .enemy-icon {
            font-size: 38px;
            background: #ff4757;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .card.flipped { border: 2px solid #00d2d3; }
        .card.flipped img, .card.flipped .enemy-icon { display: flex; }

        .card.matched {
            border: 2px solid #2ed573;
            opacity: 0.7;
            cursor: default;
        }
        .card.matched img { display: block; }

        .btn {
            padding: 8px 16px;
            background: #10ac84;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <!-- 🏆 LOGO SEKOAH & RPL -->
    <div class="emblem-container">
        <img src="images/logo-sekolah.png" alt="SMKN 1 Sanden" class="emblem-img" onerror="this.style.display='none'">
        <img src="images/logo-rpl.png" alt="RPL" class="emblem-img" onerror="this.style.display='none'">
    </div>

    <!-- 🏆 HEADER LOGO MOKO -->
    <div class="brand-header">
        <img src="images/logo-moko.png" alt="Logo Moko" class="brand-logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/808/808439.png'">
        <div class="brand-title">
            <h1>Game Development</h1>
            <p style="font-size: 11px; color: #8395a7;">Aesthetic Matching Project</p>
        </div>
    </div>

    <div id="gamepadStatus" style="font-size: 11px; padding: 4px 12px; border-radius: 10px; background: rgba(255, 255, 255, 0.1); color: #c8d6e5; margin-bottom: 10px; font-weight: bold;">
        🖱️ Mode: Mouse / Touch Screen
    </div>

    <div class="game-panel">
        <div class="char-box">
            <div class="char-avatar">
                <img src="images/logo-zalfa.png" alt="Zalfa" onerror="this.style.display='none'; this.parentElement.innerText='🤠';">
            </div>
            <span class="char-name">ZALFA</span>
        </div>

        <div class="stats-center">
            <div id="levelText" style="font-size: 12px; color: #00d2d3; font-weight: bold;">LEVEL 1</div>
            <div class="stat-badge">⏱️ Waktu: <span id="timer">60</span>s</div>
            <div class="stat-badge">🏆 Skor: <span id="score">0</span></div>
        </div>

        <div class="char-box">
            <div class="char-avatar" style="border-color: #ff4757;">👾</div>
            <span class="char-name" style="color: #ff4757;">MUSUH</span>
        </div>
    </div>

    <div class="board level-1" id="board"></div>

    <button class="btn" onclick="toggleAudio()">🎵 Suara On/Off</button>

    <script>
        const allImages = [
            'images/1.png', 'images/2.png', 'images/3.png', 'images/4.png',
            'images/5.png', 'images/6.png', 'images/7.png', 'images/8.png',
            'images/9.png', 'images/10.png', 'images/11.png', 'images/12.png'
        ];

        let currentLevel = 1;
        let score = 0;
        let timeLeft = 60;
        let timerInterval = null;
        let flippedCards = [];
        let matchedCount = 0;
        let canClick = true;
        let currentDeck = [];

        const timerEl = document.getElementById('timer');
        const scoreEl = document.getElementById('score');
        const board = document.getElementById('board');
        const levelText = document.getElementById('levelText');

        // Waktu diatur menjadi 60 detik (1 menit) untuk semua level
        const levelConfig = {
            1: { pairs: 3, hasEnemy: false, time: 60, gridClass: 'level-1', name: 'LEVEL 1: MUDAH' },
            2: { pairs: 5, hasEnemy: true,  time: 60, gridClass: 'level-2', name: 'LEVEL 2: AWAS MUSUH! 👾' },
            3: { pairs: 10, hasEnemy: true, time: 60, gridClass: 'level-3', name: 'LEVEL 3: MASTER 🏆' }
        };

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let isAudioMuted = false;

        function playSound(freq, type = 'sine', duration = 0.15) {
            if (isAudioMuted) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
            osc.stop(audioCtx.currentTime + duration);
        }

        function toggleAudio() {
            isAudioMuted = !isAudioMuted;
            alert(isAudioMuted ? "Suara Dimatikan 🔇" : "Suara Diaktifkan 🔊");
        }

        function startLevel(level) {
            clearInterval(timerInterval);
            board.innerHTML = '';
            flippedCards = [];
            matchedCount = 0;
            canClick = true;

            const config = levelConfig[level];
            timeLeft = config.time;
            timerEl.innerText = timeLeft;
            levelText.innerText = config.name;
            board.className = `board ${config.gridClass}`;

            let selectedImages = allImages.slice(0, config.pairs);
            currentDeck = [];

            selectedImages.forEach(img => {
                currentDeck.push({ type: 'img', val: img });
                currentDeck.push({ type: 'img', val: img });
            });

            if (config.hasEnemy) {
                currentDeck.push({ type: 'enemy', val: 'ENEMY' });
                currentDeck.push({ type: 'enemy', val: 'ENEMY' });
            }

            currentDeck.sort(() => Math.random() - 0.5);

            currentDeck.forEach((item, index) => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.type = item.type;
                card.dataset.value = item.val;

                if (item.type === 'img') {
                    const img = document.createElement('img');
                    img.src = item.val;
                    card.appendChild(img);
                } else {
                    const enemy = document.createElement('div');
                    enemy.classList.add('enemy-icon');
                    enemy.innerText = '👾';
                    card.appendChild(enemy);
                }

                card.onclick = function() { triggerCardFlip(this); };
                board.appendChild(card);
            });

            timerInterval = setInterval(() => {
                timeLeft--;
                timerEl.innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    playSound(150, 'sawtooth', 0.5);
                    alert('⏳ Waktu Habis! Coba lagi!');
                    startLevel(currentLevel);
                }
            }, 1000);
        }

        function triggerCardFlip(card) {
            if (!canClick || card.classList.contains('flipped') || card.classList.contains('matched')) return;

            playSound(400, 'sine', 0.1);
            card.classList.add('flipped');

            if (card.dataset.type === 'enemy') {
                playSound(120, 'sawtooth', 0.4);
                score = Math.max(0, score - 10); // Hukuman musuh dikurangi menjadi -10
                scoreEl.innerText = score;
                canClick = false;

                setTimeout(() => {
                    alert('👾 JEBAKAN MUSUH! Skor berkurang -10!');
                    card.classList.remove('flipped');
                    canClick = true;
                }, 500);
                return;
            }

            flippedCards.push(card);

            if (flippedCards.length === 2) {
                checkMatch();
            }
        }

        function checkMatch() {
            const [card1, card2] = flippedCards;

            if (card1.dataset.value === card2.dataset.value) {
                playSound(600, 'sine', 0.2);
                card1.classList.add('matched');
                card2.classList.add('matched');
                
                score += 10; // Penambahan skor dikurangi menjadi +10 (sebelumnya +20)
                scoreEl.innerText = score;
                
                flippedCards = [];
                matchedCount += 2;

                const totalImageCards = currentDeck.filter(item => item.type === 'img').length;

                if (matchedCount === totalImageCards) {
                    clearInterval(timerInterval);
                    playSound(800, 'triangle', 0.4);

                    setTimeout(() => {
                        if (currentLevel < 3) {
                            alert(`🎉 Level ${currentLevel} Selesai!\nSkor Saat Ini: ${score}`);
                            currentLevel++;
                            startLevel(currentLevel);
                        } else {
                            alert(`🏆 SELAMAT! Kamu Menamatkan Seluruh Level!\nSkor Akhir: ${score}`);
                        }
                    }, 400);
                }
            } else {
                playSound(200, 'square', 0.2);
                canClick = false;

                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    flippedCards = [];
                    canClick = true;
                }, 800);
            }
        }

        startLevel(currentLevel);
    </script>
</body>
</html>
